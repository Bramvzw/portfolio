<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, indexifembedded">
<title>sooth — Terminal Demo</title>
<meta name="description" content="Geanimeerde terminal-demo van sooth met echte output: een flaky test aantonen met run-history en --verify.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --amber: #E8962A; --ink: #efe8dc; --term-bg: #0b0a08;
    --t-text: #cfc6b6; --t-dim: #7d7568; --t-ok: #7fc96d; --t-bad: #e06c5a;
    --term-font: 12px; --controls-h: 150px;
  }
  html, body { height: 100%; overflow: hidden; background: transparent; font-family: 'Lora', Georgia, serif; color: var(--ink); -webkit-font-smoothing: antialiased; cursor: none; }
  .cursor-dot, .cursor-ring { position: fixed; top: 0; left: 0; border-radius: 50%; pointer-events: none; opacity: 0; transform: translate(-50%, -50%); will-change: transform, width, height; }
  .cursor-dot { width: 8px; height: 8px; background: var(--amber); z-index: 9999; transition: width .25s cubic-bezier(.2,.8,.2,1), height .25s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
  .cursor-ring { width: 34px; height: 34px; border: 1px solid rgba(232,150,42,.35); z-index: 9998; transition: width .3s cubic-bezier(.2,.8,.2,1), height .3s cubic-bezier(.2,.8,.2,1), border-color .25s ease, opacity .2s ease; }
  .cursor-dot.hov { width: 0; height: 0; }
  .cursor-ring.hov { width: 56px; height: 56px; border-color: rgba(232,150,42,.85); background: rgba(232,150,42,.08); }
  @media (hover: none), (max-width: 560px) { .cursor-dot, .cursor-ring { display: none; } html, body { cursor: auto; } }

  #stage { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: stretch; padding: 4px 2px 6px; }
  #term { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: var(--term-bg); border: 1px solid rgba(255,255,255,.10); box-shadow: 0 30px 60px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(232,150,42,.06); overflow: hidden; cursor: none; }
  .term-bar { flex: 0 0 auto; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .term-bar i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.14); display: inline-block; }
  .term-bar i:first-child { background: var(--amber); }
  .term-bar span { margin-left: 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--t-dim); }
  #screen { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 16px 18px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: var(--term-font); line-height: 1.7; color: var(--t-text); display: flex; flex-direction: column; justify-content: flex-end; }
  .ln { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.7em; }
  .ln.ind { padding-left: 4ch; text-indent: -2ch; }
  .ln.gap { min-height: .6em; }
  .t-dim { color: var(--t-dim); } .t-prompt { color: var(--amber); } .t-ok { color: var(--t-ok); }
  .t-bad { color: var(--t-bad); } .t-warn { color: var(--amber); } .t-cmd { color: var(--ink); }
  .caret { display: inline-block; width: .6em; height: 1.1em; vertical-align: -0.18em; background: var(--t-dim); margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #under { flex: 0 0 var(--controls-h); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 14px; }
  #caption-area { text-align: center; min-height: 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 12px; max-width: 520px; }
  .caption-eyebrow { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 2.4px; color: var(--amber); opacity: 0; transform: translateY(4px); transition: opacity .35s ease, transform .35s ease; }
  .caption-main { font-size: 16px; font-weight: 500; line-height: 1.4; color: var(--ink); text-wrap: balance; opacity: 0; transform: translateY(6px); transition: opacity .35s ease .08s, transform .35s ease .08s; }
  .caption-eyebrow.show, .caption-main.show { opacity: 1; transform: translateY(0); }

  #progress-bar { width: min(300px, 80%); height: 3px; background: rgba(255,255,255,.08); border-radius: 3px; margin-top: 12px; position: relative; cursor: none; touch-action: pan-y; }
  #progress-bar::before { content: ''; position: absolute; left: 0; right: 0; top: -10px; bottom: -10px; }
  #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--amber), #f4b85f); border-radius: 3px; pointer-events: none; }
  #progress-thumb { position: absolute; top: 50%; left: 0%; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 5px rgba(0,0,0,.55), 0 0 0 2px rgba(232,150,42,.55); transform: translate(-50%, -50%); opacity: 0; transition: opacity .2s ease, transform .15s ease; pointer-events: none; }
  #progress-bar:hover #progress-thumb, #progress-bar.scrubbing #progress-thumb { opacity: 1; }
  #progress-bar.scrubbing #progress-thumb { transform: translate(-50%, -50%) scale(1.15); }
  #controls { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
  #play-toggle { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(232,150,42,.30); background: rgba(232,150,42,.10); color: var(--amber); display: flex; align-items: center; justify-content: center; cursor: none; padding: 0; transition: background .2s ease, border-color .2s ease, transform .15s ease; -webkit-tap-highlight-color: transparent; }
  #play-toggle:hover { background: rgba(232,150,42,.18); border-color: rgba(232,150,42,.5); }
  #play-toggle:active { transform: scale(.92); }
  #play-toggle:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #play-toggle svg { width: 16px; height: 16px; fill: currentColor; }
  #beat-dots { display: flex; gap: 5px; align-items: center; }
  .beat-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.15); transition: background .3s ease, transform .3s ease; }
  .beat-dot.active { background: var(--amber); transform: scale(1.3); }
  @media (max-width: 560px) { :root { --term-font: 10.5px; --controls-h: 160px; } #screen { padding: 12px; } .caption-main { font-size: 15px; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } .caption-eyebrow, .caption-main { transition: none; } }

  /* Light theme of the page that embeds this demo: dark text for the caption and the controls.
     The device itself (phone, browser, terminal) stays dark. */
  html.light .caption-eyebrow { color: #7d430a; }
  html.light .caption-main { color: #2b2218; }
  html.light #progress-bar { background: rgba(43,34,24,.14); }
  html.light #progress-thumb { background: #2b2218; }
  html.light .beat-dot { background: rgba(43,34,24,.22); }
  html.light .beat-dot.active { background: #a85f12; }
  html.light #play-toggle { color: #7d430a; border-color: rgba(125,67,10,.45); background: rgba(125,67,10,.08); }
  html.light #play-toggle:hover { background: rgba(125,67,10,.16); border-color: rgba(125,67,10,.6); }
/* Out of view in the portfolio: every animation holds still (see setAway in the script). */
html.away *, html.away *::before, html.away *::after{ animation-play-state:paused !important; }
</style>
<script>
/* The theme follows the page that embeds this demo: ?theme=light when it loads, a message when it switches. */
(function () {
  var set = function (t) { document.documentElement.classList.toggle('light', t === 'light'); };
  try { set(new URLSearchParams(location.search).get('theme')); } catch (e) {}
  window.addEventListener('message', function (e) { var d = e.data; if (d && d.type === 'portfolio-theme') set(d.theme); });
})();
</script>
</head>
<body>
<div class="cursor-ring" id="cring"></div>
<div class="cursor-dot" id="cdot"></div>
<div id="stage">
  <div id="term" role="img" aria-label="Terminal met echte output van sooth op een PHPUnit-project">
    <div class="term-bar"><i></i><i></i><i></i><span>~/demo-project — zsh</span></div>
    <div id="screen"></div>
  </div>
  <div id="under">
    <div id="caption-area" aria-live="polite">
      <div class="caption-eyebrow" id="cap-eyebrow"></div>
      <div class="caption-main" id="cap-main"></div>
    </div>
    <div id="progress-bar"><div id="progress-fill"></div><div id="progress-thumb"></div></div>
    <div id="controls">
      <button id="play-toggle" type="button" aria-label="Pauzeren"></button>
      <div id="beat-dots"></div>
    </div>
  </div>
</div>
<script>
'use strict';
/* Every output line is copied verbatim, colours included, from real sooth 0.3.4 runs on a
   small PHPUnit project: four steady tests, one test that fails at random, and one test that
   the latest commit (9cc8049) broke; the commit before it was green three times. Between the
   first and the second step three more runs happened, before the third one more. Only
   PHPUnit's own output is cut, shown as "…". */
const CMD_RUN    = 'sooth run --preset phpunit -- vendor/bin/phpunit';
const CMD_VERIFY = 'sooth run --verify --preset phpunit -- vendor/bin/phpunit';
const L = (...segs) => ({ segs });
const I = (...segs) => ({ segs, cls: 'ind' });
const beats = [
  { at: 0, eyebrow: 'Eerste run', caption: 'sooth draait je eigen testcommando en leest het rapport. Eén test faalt.', cmd: CMD_RUN, out: [
    L(['t-dim', '…']),
    L(["", "run 1/1: "], ["t-bad", "runner exit=1"], ["", " (92.31ms)"]),
    L(["", "tests: 6 total — "], ["t-ok", "5 passed"], ["", ", "], ["t-bad", "1 failed"], ["", ", 0 errors, 0 skipped"]),
    L(["t-bad", "1 failure — 1 new"]),
    I(["t-bad", "✗"], ["", " "], ["t-dim", "Tests."], ["", "MailTest::test_receipt_subject — "], ["t-bad", "new (nothing in history)"]),
    L(["t-bad", "result: ✗ FAILED — 1 of 1 runs failed (92.31ms total)"]),
  ]},
  { at: 6500, eyebrow: 'Geschiedenis', caption: 'Elke run komt in een lokaal logbestand. Na een paar runs is test_ships aantoonbaar flaky, en de mailtest faalt sinds commit 9cc8049.', cmd: CMD_RUN, out: [
    L(['t-dim', '…']),
    L(["", "run 1/1: "], ["t-bad", "runner exit=1"], ["", " (90.36ms)"]),
    L(["", "tests: 6 total — "], ["t-ok", "4 passed"], ["", ", "], ["t-bad", "2 failed"], ["", ", 0 errors, 0 skipped"]),
    L(["t-bad", "2 failures — 1 known flake, 1 regression"]),
    I(["t-bad", "▼"], ["", " "], ["t-dim", "Tests."], ["", "MailTest::test_receipt_subject — "], ["t-bad", "failing since 9cc8049 (the last 5 observed runs)"]),
    I(["t-warn", "~"], ["", " "], ["t-dim", "Tests."], ["", "OrderTest::test_ships — "], ["t-warn", "known flake (3 of 8 in history, 38%)"]),
    L(["t-bad", "result: ✗ FAILED — 1 of 1 runs failed (90.36ms total)"]),
  ]},
  { at: 14000, eyebrow: '--verify', caption: 'Met --verify draait sooth alleen de gefaalde tests opnieuw. De mailtest is echt kapot, test_ships niet.', cmd: CMD_VERIFY, out: [
    L(['t-dim', '…']),
    L(["", "run 1/1: "], ["t-bad", "runner exit=1"], ["", " (90.38ms)"]),
    L(["", "tests: 6 total — "], ["t-ok", "4 passed"], ["", ", "], ["t-bad", "2 failed"], ["", ", 0 errors, 0 skipped"]),
    L(["t-bad", "2 failures — 1 known flake, 1 regression"]),
    I(["t-bad", "▼"], ["", " "], ["t-dim", "Tests."], ["", "MailTest::test_receipt_subject — "], ["t-bad", "real (reproduced on re-run)"], ["", ", "], ["t-bad", "failing since 9cc8049 (the last 7 observed runs)"]),
    I(["t-warn", "~"], ["", " "], ["t-dim", "Tests."], ["", "OrderTest::test_ships — "], ["t-warn", "flaky or order-dependent (passed on re-run in isolation)"], ["", ", "], ["t-warn", "known flake (4 of 10 in history, 40%)"]),
    L(["t-bad", "result: ✗ FAILED — 1 of 1 runs failed (90.38ms total)"]),
  ]},
  { at: 22500, eyebrow: 'Exitcode', caption: 'Een falende test blijft een foutcode geven. sooth legt een fout uit, maar verbergt hem niet.', keep: true, cmd: 'echo $?', out: [
    L(['t-bad', '1']),
  ]},
  { at: 27000, eyebrow: 'sooth history', caption: 'Wat sooth tot nu toe weet, zonder iets te draaien. Geen server, geen account.', cmd: 'sooth history', out: [
    L(["t-bad", "flaky per history (mixed outcomes on one commit):"]),
    I(["", "1. "], ["t-warn", "~"], ["", " "], ["t-dim", "Tests."], ["", "OrderTest::test_ships "], ["t-bad", "failed 4 of 10 observed runs (40%)"]),
    L(["t-bad", "failing since a commit boundary:"]),
    I(["t-bad", "▼"], ["", " "], ["t-dim", "Tests."], ["", "MailTest::test_receipt_subject "], ["t-dim", "(since 9cc8049, failed the last 7 observed runs)"]),
    L(["", "history now holds 60 observations"]),
  ]},
];
const TOTAL = 34000;

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const screenEl = document.getElementById('screen');
const capEye = document.getElementById('cap-eyebrow');
const capMain = document.getElementById('cap-main');
const fill = document.getElementById('progress-fill');
const thumb = document.getElementById('progress-thumb');
const dotsWrap = document.getElementById('beat-dots');
const dots = beats.map(() => { const d = document.createElement('div'); d.className = 'beat-dot'; dotsWrap.appendChild(d); return d; });

function lineEl(line) {
  const el = document.createElement('div');
  el.className = 'ln' + (line.cls ? ' ' + line.cls : '');
  line.segs.forEach(([cls, text]) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; el.appendChild(s); });
  return el;
}
function promptLine(text) {
  const el = document.createElement('div');
  el.className = 'ln';
  el.innerHTML = '<span class="t-prompt">$ </span><span class="t-cmd"></span><span class="caret"></span>';
  el.querySelector('.t-cmd').textContent = text || '';
  return el;
}
function gap() { const el = document.createElement('div'); el.className = 'ln gap'; return el; }
function trimScreen() { while (screenEl.children.length > 40) screenEl.removeChild(screenEl.firstChild); }
function setCaption(eyebrow, main) {
  capEye.classList.remove('show'); capMain.classList.remove('show');
  setTimeout(() => { capEye.textContent = eyebrow; capMain.textContent = main; capEye.classList.add('show'); capMain.classList.add('show'); }, reduceMotion ? 0 : 160);
}

let renderToken = 0;
const wait = (ms) => new Promise(r => setTimeout(r, ms));
function clearCarets() { screenEl.querySelectorAll('.caret').forEach(c => c.remove()); }
function renderInstant(beat) {
  const p = promptLine(beat.cmd); p.querySelector('.caret').remove(); screenEl.appendChild(p);
  beat.out.forEach(l => screenEl.appendChild(lineEl(l)));
}
async function renderBeat(idx, animate) {
  const token = ++renderToken;
  const beat = beats[idx];
  const alive = () => token === renderToken;
  screenEl.innerHTML = '';
  if (beat.keep) { renderInstant(beats[idx - 1]); screenEl.appendChild(gap()); }
  setCaption(beat.eyebrow, beat.caption);
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  if (!animate || reduceMotion) { renderInstant(beat); screenEl.appendChild(promptLine('')); return; }
  const p = promptLine(''); screenEl.appendChild(p);
  const cmdEl = p.querySelector('.t-cmd');
  await wait(450);
  for (const ch of beat.cmd) { if (!alive()) return; cmdEl.textContent += ch; await wait(22 + Math.random() * 26); }
  await wait(350);
  if (!alive()) return;
  clearCarets();
  for (const line of beat.out) { if (!alive()) return; screenEl.appendChild(lineEl(line)); trimScreen(); await wait(170); }
  if (!alive()) return;
  screenEl.appendChild(promptLine(''));
}

let elapsed = 0, lastNow = null, currentBeat = -1, paused = false, seeking = false, rafHandle = null, away = false, begun = false;
function updateProgress() { const pct = Math.min(100, (elapsed / TOTAL) * 100); fill.style.width = pct + '%'; thumb.style.left = pct + '%'; }
function tick(now) {
  rafHandle = null;
  if (away) return;   // out of view: the loop stops here, setAway starts it again
  if (lastNow === null) lastNow = now;
  const delta = Math.min(now - lastNow, 100); lastNow = now;   // a long gap (out of view, another tab) is not demo time
  if (!paused && !seeking) elapsed += delta;
  for (let i = 0; i < beats.length; i++) if (elapsed >= beats[i].at && currentBeat < i) { currentBeat = i; renderBeat(i, true); }
  updateProgress();
  if (elapsed >= TOTAL && !seeking) { elapsed = 0; currentBeat = -1; }
  rafHandle = requestAnimationFrame(tick);
}
function seekTo(fraction) {
  fraction = Math.max(0, Math.min(1, fraction));
  elapsed = Math.min(fraction * TOTAL, TOTAL - 50);
  let idx = 0;
  for (let i = 0; i < beats.length; i++) if (elapsed >= beats[i].at) idx = i;
  if (idx !== currentBeat) { currentBeat = idx; renderBeat(idx, false); }
  updateProgress();
}

const PAUSE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
const PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const playToggle = document.getElementById('play-toggle');
function setPaused(p) { paused = p; playToggle.innerHTML = paused ? PLAY_ICON : PAUSE_ICON; playToggle.setAttribute('aria-label', paused ? 'Afspelen' : 'Pauzeren'); }
playToggle.addEventListener('click', (e) => { e.stopPropagation(); setPaused(!paused); });
document.getElementById('term').addEventListener('click', () => setPaused(!paused));

const progressBar = document.getElementById('progress-bar');
const seekFromClientX = (x) => { const r = progressBar.getBoundingClientRect(); seekTo((x - r.left) / r.width); };
// A finger (or pen) that lands on the bar is usually scrolling the page past the demo. So it
// only scrubs once it moves sideways, and a plain tap jumps to that spot; up-and-down swipes are
// left to the page (touch-action: pan-y). A mouse scrubs from the first press, as before.
let touchStart = null, tapPending = false, scrubId = null;
const beginScrub = (e) => {
  seeking = true;
  scrubId = e.pointerId;
  progressBar.classList.add('scrubbing');
  try { progressBar.setPointerCapture(e.pointerId); } catch (_) {}
  seekFromClientX(e.clientX);
};
progressBar.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse') {                 // finger or pen: wait and see what it does
    if (seeking || touchStart) return;             // one pointer at a time
    touchStart = { id: e.pointerId, x: e.clientX, y: e.clientY };
    tapPending = true;
    return;
  }
  tapPending = false;
  e.preventDefault();
  beginScrub(e);
});
progressBar.addEventListener('pointermove', (e) => {
  if (touchStart && e.pointerId === touchStart.id && !seeking) {
    const dx = Math.abs(e.clientX - touchStart.x), dy = Math.abs(e.clientY - touchStart.y);
    if (dx > 6 || dy > 6) tapPending = false;
    if (dx > 8 && dx > dy) { touchStart = null; beginScrub(e); }
    return;
  }
  if (seeking && e.pointerId === scrubId) seekFromClientX(e.clientX);
});
const endScrub = () => { if (!seeking) return; seeking = false; progressBar.classList.remove('scrubbing'); };
const release = (e, cancelled) => {
  if (touchStart && e.pointerId === touchStart.id) { touchStart = null; if (cancelled) tapPending = false; }
  if (seeking && e.pointerId === scrubId) { scrubId = null; endScrub(); }
};
progressBar.addEventListener('pointerup', (e) => release(e, false));
progressBar.addEventListener('pointercancel', (e) => release(e, true));   // the page took the gesture
// The browser sends no click for a tap that only stops a scroll, so this is a deliberate tap.
progressBar.addEventListener('click', (e) => { if (!tapPending) return; tapPending = false; e.stopPropagation(); seekFromClientX(e.clientX); });

(() => {
  if (window.matchMedia('(hover: none)').matches) return;
  const dot = document.getElementById('cdot'), ring = document.getElementById('cring');
  let x = innerWidth / 2, y = innerHeight / 2, rx = x, ry = y, tx = x, ty = y;
  // Frames only run while the ring is still catching up with the pointer.
  let moving = false;
  const kick = () => { if (!moving) { moving = true; requestAnimationFrame(loop); } };
  window.addEventListener('mousemove', (e) => { tx = e.clientX; ty = e.clientY; kick(); });
  const loop = () => { x += (tx - x) * 0.9; y += (ty - y) * 0.9; rx += (tx - rx) * 0.18; ry += (ty - ry) * 0.18;
    dot.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`; ring.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;
    if (Math.abs(tx - rx) + Math.abs(ty - ry) < 0.05) { moving = false; return; }
    requestAnimationFrame(loop); };
  kick();
  const hovSel = '#term, #progress-bar, #play-toggle';
  document.addEventListener('mouseover', (e) => { if (e.target.closest(hovSel)) { dot.classList.add('hov'); ring.classList.add('hov'); } });
  document.addEventListener('mouseout', (e) => { if (e.target.closest(hovSel)) { dot.classList.remove('hov'); ring.classList.remove('hov'); } });
  document.addEventListener('mouseleave', () => { dot.style.opacity = 0; ring.style.opacity = 0; });
  document.addEventListener('mouseenter', () => { dot.style.opacity = 1; ring.style.opacity = 1; });
})();

playToggle.innerHTML = PAUSE_ICON;
const qBeat = new URLSearchParams(location.search).get('beat');
if (qBeat !== null) { setPaused(true); seekTo(beats[Math.min(beats.length - 1, +qBeat)].at / TOTAL + 0.001); }
else if (reduceMotion) { setPaused(true); seekTo(beats[2].at / TOTAL + 0.001); }

// Out of view (scrolled away in the portfolio): stop the clock and the frame loop, so the page
// around the demo scrolls freely. The demo carries on from the same moment when it is back.
function setAway(a) {
  if (a === away) return;
  away = a;
  document.documentElement.classList.toggle('away', a);
  if (!a) lastNow = null;   // also when a frame is still waiting: it must not count the time away
  if (!a && begun && !rafHandle) rafHandle = requestAnimationFrame(tick);
}
if ('IntersectionObserver' in window) {
  new IntersectionObserver((es) => setAway(!es[es.length - 1].isIntersecting)).observe(document.documentElement);
}
begun = true;
rafHandle = requestAnimationFrame(tick);
</script>
</body>
</html>
